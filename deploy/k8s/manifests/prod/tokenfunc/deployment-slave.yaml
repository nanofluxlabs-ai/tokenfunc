# slave：多副本，只接 API 流量（NODE_TYPE=slave 不跑上游定时任务；二开后台任务靠 Redis 锁，slave 上也不会重复执行）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokenfunc-api-slave
  namespace: tokenfunc
  labels:
    app: tokenfunc-api
    role: slave
spec:
  # 固定 3 副本，每个节点一个（集群固定 3 台，不开 HPA）；容量核算见 docs/worklog/2026-11-18-chore-tke-resource-quota.md
  replicas: 3
  selector:
    matchLabels:
      app: tokenfunc-api
      role: slave
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: tokenfunc-api
        role: slave
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      terminationGracePeriodSeconds: 1830
      affinity:
        podAntiAffinity:
          # 软约束：尽量分散到不同节点；用 required 会让滚动更新时 Terminating Pod 占槽、新 Pod 调度不上
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: tokenfunc-api
                  role: slave
              topologyKey: kubernetes.io/hostname
      # 业务不访问 apiserver；集群 Gatekeeper 也禁止自动挂载 SA token
      automountServiceAccountToken: false
      containers:
      - name: tokenfunc-api
        # 同 master：apply 前核对线上 tag
        image: ghcr.io/nanofluxlabs-ai/tokenfunc:latest
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: tokenfunc-api-config
        - secretRef:
            name: tokenfunc-api
        env:
        - name: NODE_TYPE
          value: "slave"
        # 约为 memory limit 的 88%：GC 在 OOM kill 之前收紧
        - name: GOMEMLIMIT
          value: "1800MiB"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
        resources:
          requests:
            # 网关是全部流量入口：request 按常态高峰预留，节点内存紧张时不被优先驱逐。
            # 800m 是「宕一台节点剩余 2 台仍装得下全部 Pod」的上限，再调大要先加节点
            memory: "1Gi"
            cpu: "800m"
          limits:
            # 请求体全量入内存（ingress 放行 200m）+ 流式连接缓冲；配合 GOMEMLIMIT 1800MiB
            memory: "2Gi"
            # Go 1.25+ 按 CPU limit 设 GOMAXPROCS=2；突发时借用节点空闲 CPU
            cpu: "2000m"
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
