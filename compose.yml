# tokenfunc 统一编排：开发 / 测试 / 生产共用这一份文件。
#
#   开发与测试   make dev / make test-db   只起 postgres + redis，API 与前端跑在宿主机
#   全栈或生产   make up                   追加 profile "app"，API 以镜像方式运行
#
# 变量来自 .env（模板见 .env.example）；make 目标会把开发默认值导出给 compose，
# 所以本地不需要手写 .env。生产环境必须准备完整的 .env。
#
# 隔离约定：开发、测试共用同一个 PostgreSQL 与 Redis 实例，
#   PostgreSQL 用 schema 区分（dev / test / public），Redis 用 db 区分（0 / 1）。
name: tokenfunc

services:
  postgres:
    # 接管已有数据卷时用 TF_PG_IMAGE 钉住与数据文件一致的大版本（如 postgres:15）
    image: ${TF_PG_IMAGE:-postgres:17.11-bookworm}
    container_name: tokenfunc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TF_PG_USER:-tokenfunc}
      POSTGRES_PASSWORD: ${TF_PG_PASSWORD:?TF_PG_PASSWORD 未设置，请参考 .env.example}
      POSTGRES_DB: ${TF_PG_DB:-tokenfunc}
      # 数据卷首次初始化时由 deploy/postgres/init-schemas.sh 创建；之后由 make db-schemas 幂等维护
      TF_PG_SCHEMAS: ${TF_PG_SCHEMAS:-dev,test}
    ports:
      - "127.0.0.1:${TF_PG_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-schemas.sh:/docker-entrypoint-initdb.d/10-schemas.sh:ro
    healthcheck:
      # 初始化阶段的临时进程只监听 Unix socket；走 TCP 真正查询一次，避免提前放行
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -c 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - tokenfunc

  redis:
    image: ${TF_REDIS_IMAGE:-redis:7.4.11-bookworm}
    container_name: tokenfunc-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${TF_REDIS_PASSWORD:?TF_REDIS_PASSWORD 未设置，请参考 .env.example}
      REDISCLI_AUTH: ${TF_REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${TF_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - tokenfunc

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TF_API_IMAGE:-tokenfunc-api:local}
    container_name: tokenfunc-api
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      # 只绑回环：生产由宿主机 nginx 终止 TLS 后转发到这里
      - "127.0.0.1:${TF_API_PORT:-3000}:3000"
    volumes:
      - api-data:/data
      - api-logs:/app/logs
    environment:
      SQL_DSN: postgresql://${TF_PG_USER:-tokenfunc}:${TF_PG_PASSWORD}@postgres:5432/${TF_PG_DB:-tokenfunc}?search_path=${TF_PG_SCHEMA:-public}
      REDIS_CONN_STRING: redis://:${TF_REDIS_PASSWORD}@redis:6379/${TF_REDIS_DB:-0}
      SESSION_SECRET: ${TF_SESSION_SECRET:?TF_SESSION_SECRET 未设置，请参考 .env.example}
      # false：本地 HTTP；生产 HTTPS 必须改为 true 并列出可信 Origin
      SESSION_COOKIE_SECURE: ${TF_SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_TRUSTED_URL: ${TF_SESSION_COOKIE_TRUSTED_URL:-}
      NODE_NAME: ${TF_NODE_NAME:-tokenfunc-api-1}
      # 留空时应用默认信任回环与私网网段并打印告警；生产填 nginx 所在的 docker 网段
      TRUSTED_PROXIES: ${TF_TRUSTED_PROXIES:-}
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      TZ: ${TZ:-Asia/Shanghai}
      # 系统日志：容器默认 NDJSON（CLS 按 JSON 提取），本地 make api 用 text；文件按大小/天数滚动
      LOG_FORMAT: ${TF_LOG_FORMAT:-json}
      LOG_MAX_SIZE_MB: ${TF_LOG_MAX_SIZE_MB:-64}
      LOG_MAX_BACKUPS: ${TF_LOG_MAX_BACKUPS:-32}
      LOG_RETENTION_DAYS: ${TF_LOG_RETENTION_DAYS:-7}
      # 服务端日志与未指定语言的请求提示 / 邮件 / 通知的默认语言（上游 rc.44 起支持），与上游默认保持一致
      DEFAULT_LANGUAGE: ${TF_DEFAULT_LANGUAGE:-zh-CN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - tokenfunc

volumes:
  postgres-data:
  redis-data:
  api-data:
  api-logs:

networks:
  tokenfunc:
    driver: bridge
