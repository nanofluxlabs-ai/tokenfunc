# 非敏感配置；改完 kubectl apply 后要 rollout restart 才生效（env 注入不热更新）
apiVersion: v1
kind: ConfigMap
metadata:
  name: tokenfunc-api-config
  namespace: tokenfunc
data:
  TZ: "Asia/Shanghai"
  # 只打 stdout（JSON），交给腾讯云 CLS 采集容器日志；留空即关闭文件日志
  LOG_DIR: ""
  LOG_FORMAT: "json"
  DEFAULT_LANGUAGE: "zh-CN"
  DEBUG: "false"
  ERROR_LOG_ENABLED: "true"
  BATCH_UPDATE_ENABLED: "true"
  MEMORY_CACHE_ENABLED: "true"
  # SSE 可能跑几十分钟：收到 SIGTERM 后最多等这么久再强制退出；terminationGracePeriodSeconds 必须比它大
  SHUTDOWN_TIMEOUT_SECONDS: "1800"
  # 生产 HTTPS：Secure Cookie + 可信 Origin 白名单（逗号分隔，不支持通配符）
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_TRUSTED_URL: "https://tokenfunc.com,https://www.tokenfunc.com"
  # 留空 = 信任回环与私网网段（ingress-nginx 在集群内，Pod 网段属私网）并打印一条启动告警；要收紧就填 ingress-nginx 的 Pod CIDR
  TRUSTED_PROXIES: ""
  # 连接池（只列应用实际读取的键）
  SQL_MAX_OPEN_CONNS: "60"
  SQL_MAX_IDLE_CONNS: "20"
  SQL_MAX_LIFETIME: "600"
  REDIS_POOL_SIZE: "100"
  RELAY_MAX_IDLE_CONNS: "2000"
  RELAY_MAX_IDLE_CONNS_PER_HOST: "200"
  # logs 表保留 + 归档：消费 / 错误日志 PG 保留 90 天，先按天归档 COS 再删；充值 / 调额 / 退款永不删；只删 ≤ 预聚合游标的天
  DB_LOG_RETENTION_DAYS: "90"
  DB_LOG_RETENTION_RUN_AT: "03:00"
  DB_LOG_RETENTION_MAX_DAYS_PER_RUN: "30"
  DB_LOG_RETENTION_BATCH_LIMIT: "2000"
  DB_LOG_RETENTION_BATCH_PAUSE_MS: "200"
  # 归档对象存储（腾讯云 COS 东京，S3 兼容）；桶名带 -APPID 后缀；密钥在 secret tokenfunc-api
  LOG_ARCHIVE_S3_ENDPOINT: "https://cos.ap-tokyo.myqcloud.com"
  LOG_ARCHIVE_S3_REGION: "ap-tokyo"
  LOG_ARCHIVE_S3_BUCKET: "<bucket>-<appid>"
  LOG_ARCHIVE_S3_PREFIX: "prod"
  LOG_ARCHIVE_S3_PATH_STYLE: "false"
