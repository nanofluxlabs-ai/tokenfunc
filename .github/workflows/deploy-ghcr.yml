name: Build & Deploy (GHCR)

# Builds the image from source and pushes it to GHCR under this repository's
# namespace. Pushing a release tag (v*) builds `<tag>` and moves `:latest`;
# pushes to main only build a `main-<date>-<sha>` image.
# This workflow never deploys. Deployment is done from the operator's machine:
#   - single host (docker compose over SSH): the `/release-standalone` skill
#   - TKE cluster (kubectl rolling update):  the `/release-tke` skill
# Both skills wait for the build job of the tag's run before deploying.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Builds run per ref so a main build never queues a release.
concurrency:
  group: deploy-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Resolve version & write VERSION
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="main-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$VERSION" > VERSION
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Release tags also move :latest; main builds only get their own tag
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.release == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
