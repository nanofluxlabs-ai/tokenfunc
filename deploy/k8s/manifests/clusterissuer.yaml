# Let's Encrypt 签发者（集群级，只装一次）；邮箱收证书到期提醒
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: support@tokenfunc.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx
          # TKE 给每个 Pod 注入 root 运行的 security-defense initContainer，solver Pod 默认的 Pod 级
          # runAsNonRoot 会把它拦住；改为 Pod 级固定非 root uid（initContainer 自带容器级 runAsUser: 0，不受影响）
          podTemplate:
            spec:
              securityContext:
                runAsNonRoot: false
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
