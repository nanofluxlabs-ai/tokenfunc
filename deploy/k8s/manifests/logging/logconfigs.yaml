---
# ingress-nginx 访问日志（JSON）；error log 进 LogParseFailure
apiVersion: cls.cloud.tencent.com/v1
kind: LogConfig
metadata:
  name: ingress-nginx
spec:
  clsDetail:
    topicId: 4bbdab62-7f1c-4fbf-b2e4-c25002042b3b
    logType: json_log
    extractRule:
      unMatchUpload: "true"
      unMatchedKey: LogParseFailure
  inputDetail:
    type: container_stdout
    containerStdout:
      namespace: ingress-nginx
      allContainers: false
      includeLabels:
        app.kubernetes.io/component: controller
